name: melme
description: A music app UI in Dart.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter_skill: ^0.2.6
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  just_audio: ^0.9.34
  permission_handler: ^11.3.0
  provider: ^6.1.1
  image_picker: ^1.0.7
  shared_preferences: ^2.5.5
  http: ^1.2.1
  flutter_dotenv: ^5.2.1
  youtube_player_iframe: ^5.2.2
  share_plus: ^13.1.0
  palette_generator: ^0.3.3+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/
    - assets/images/
    - assets/audio/
